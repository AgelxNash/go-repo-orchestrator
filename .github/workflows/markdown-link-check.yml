name: Markdown Link Check
permissions:
  contents: read
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Monday
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown Links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
