name: YAML Lint
permissions:
  contents: read
on:
  push:
    paths: [ '**/*.yaml', '**/*.yml' ]
  pull_request:
    paths: [ '**/*.yaml', '**/*.yml' ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate YAML
        uses: ibiqlik/action-yamllint@v3
