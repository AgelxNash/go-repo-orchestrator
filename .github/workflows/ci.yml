name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "Found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race detector + coverage)
        run: |
          pkg_patterns="./cmd/... ./internal/..."
          if [ -d ./pkg ]; then
            pkg_patterns="$pkg_patterns ./pkg/..."
          fi
          mkdir -p tmp
          go test -race -coverprofile=tmp/coverage.out $(go list $pkg_patterns)
          go tool cover -func=tmp/coverage.out

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: tmp/coverage.out
          retention-days: 14

      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Vet
        run: |
          pkg_patterns="./cmd/... ./internal/..."
          if [ -d ./pkg ]; then
            pkg_patterns="$pkg_patterns ./pkg/..."
          fi
          go vet $(go list $pkg_patterns)

      - name: Build
        run: |
          pkg_patterns="./cmd/... ./internal/..."
          if [ -d ./pkg ]; then
            pkg_patterns="$pkg_patterns ./pkg/..."
          fi
          go build $(go list $pkg_patterns)

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: --timeout=5m
